<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cat Spin Earn</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Confetti for Wins -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Monetag SDK -->
    <script src="//libtl.com/sdk.js" data-zone="10491425" data-sdk="show_10491425"></script>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="user-info">
                <span id="username">User</span>
            </div>
            <div class="balance-box">
                <img src="https://img.icons8.com/emoji/48/coin-emoji.png" alt="coin" width="20">
                <span id="balance">0</span>
            </div>
        </header>

        <!-- Pages -->
        <main>
            <!-- 🏠 HOME PAGE -->
            <section id="home-page" class="active-page">
                <h2 class="neon-title">SPIN TO EARN</h2>
                
                <div class="wheel-container">
                    <div class="pointer">▼</div>
                    <div class="wheel" id="wheel">
                        <!-- Segments generated by CSS/JS -->
                        <div class="center-cat">🐱</div>
                    </div>
                </div>

                <button id="spin-btn" class="glow-btn">
                    📺 Watch Ad & Spin
                </button>
            </section>

            <!-- 👥 REFERRAL PAGE -->
            <section id="referral-page" class="hidden-page">
                <h2>Invite Friends</h2>
                <div class="card">
                    <div class="icon-big">🤝</div>
                    <p>Get <strong>20 Coins</strong> for every friend!</p>
                    <div class="referral-link-box">
                        <input type="text" id="ref-link" readonly value="Loading...">
                        <button onclick="copyReferral()">Copy</button>
                    </div>
                    <div class="stats">
                        <p>Friends Invited: <span id="ref-count">0</span></p>
                    </div>
                </div>
            </section>

            <!-- 💸 PAYOUT PAGE -->
            <section id="payout-page" class="hidden-page">
                <h2>Withdraw Funds</h2>
                <div class="card">
                    <label>Select Crypto</label>
                    <select id="crypto-select">
                        <option value="TRX">TRX (Tron)</option>
                        <option value="TON">TON (Telegram)</option>
                        <option value="LTC">Litecoin</option>
                    </select>

                    <label>Wallet Address</label>
                    <input type="text" id="wallet-address" placeholder="Enter address">

                    <label>Amount (Coins)</label>
                    <input type="number" id="amount-input" placeholder="Min 500">

                    <div class="conversion-rate">
                        Rate: 1000 Coins = 1 TRX
                    </div>

                    <button id="withdraw-btn" class="glow-btn">Withdraw</button>
                    <p class="warning">⚠️ Wrong address = Lost funds.<br>Processing: 1-24 Hours.</p>
                </div>
            </section>
        </main>

        <!-- Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('home')">
                <span>🏠</span> Home
            </div>
            <div class="nav-item" onclick="switchTab('referral')">
                <span>👥</span> Friends
            </div>
            <div class="nav-item" onclick="switchTab('payout')">
                <span>💸</span> Wallet
            </div>
        </nav>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">Message</div>

    <!-- Firebase (Load as Module in app.js) -->
    <script type="module" src="app.js"></script>
</body>
</html>
